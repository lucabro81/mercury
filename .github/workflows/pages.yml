name: API docs (GitHub Pages)

# Publishes the HTTP surface's OpenAPI spec as a rendered docs page. The spec
# (apps/mercury/openapi.yaml) is the single source of truth; this lints it and
# renders it with Redocly, then deploys to GitHub Pages.
#
# One-time setup: repo Settings -> Pages -> Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - apps/mercury/openapi.yaml
      - apps/mercury/redocly.yaml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Lint the OpenAPI spec
        working-directory: apps/mercury
        run: bunx @redocly/cli@2.54.2 lint openapi.yaml
      - name: Render the docs page
        working-directory: apps/mercury
        run: bunx @redocly/cli@2.54.2 build-docs openapi.yaml -o "$GITHUB_WORKSPACE/site/index.html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
