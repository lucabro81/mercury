name: Publish to npm

# Publishes every public workspace whose version isn't on npm yet
# (scripts/publish.ts: type declarations, pack check, bun publish in
# dependency order). It runs on every push to main that touches a package.json,
# not on tags: GitHub creates no events for tags when more than three are pushed
# at once, and a release pushes one per package. Only a release changes
# versions, so any other run finds everything already published and does
# nothing.
#
# One-time setup: an npm granular token with publish rights on the @mercury-fw
# scope and create-mercury-agent, not requiring an OTP, saved as the NPM_TOKEN
# repository secret.

on:
  push:
    branches: [main]
    paths:
      - "**/package.json"
      - .github/workflows/publish.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: pack and check everything, publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # A real publish only ever runs from main; from any other branch the
      # workflow can only dry-run, and the token isn't even passed.
      - name: Refuse a real publish outside main
        if: ${{ github.ref != 'refs/heads/main' && !inputs.dry_run }}
        run: |
          echo "::error::A real publish runs only from main; dispatch it from main, or keep dry_run."
          exit 1
      - name: Check the npm token
        if: ${{ !inputs.dry_run }}
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_CONFIG_TOKEN" ]; then
            echo "::error::The NPM_TOKEN repository secret is not set: nothing can be published."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Publish
        env:
          # bun publish wants a token even for a dry run, which never uses it: a
          # dry run gets a worthless placeholder, a real publish the secret, and
          # only from main.
          NPM_CONFIG_TOKEN: ${{ inputs.dry_run && 'dry-run' || (github.ref == 'refs/heads/main' && secrets.NPM_TOKEN || '') }}
        run: bun scripts/publish.ts ${{ inputs.dry_run && '--dry-run' || '' }}
