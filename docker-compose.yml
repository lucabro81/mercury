services:
  mercury:
    build:
      context: .
      args:
        MERCURY_CLIS: ${MERCURY_CLIS:-jira,bitbucket}
    env_file:
      - path: .env
        required: false
    volumes:
      - wiki-vault:/app/wiki-vault
      # Allowlist comandi per CLI (src/tools/cli-config-loader.ts), non
      # baked nell'immagine così va solo riavviato, non ribuildato, per
      # cambiarlo. Path del repo, non dell'host — identico ovunque il
      # checkout esista.
      - ./cli-configs:/app/cli-config:ro
      # Storage delle credenziali CLI (jira/bitbucket/atlassian-admin/
      # google-chat) — seedato una volta sola da scripts/docker-entrypoint.sh
      # da variabili base64 in .env se il volume è vuoto, poi mai più
      # toccato: i refresh token che le CLI scrivono durante l'esecuzione
      # sopravvivono così a un redeploy, stesso pattern di wiki-vault/
      # qdrant-data. Su dev Mac, docker-compose.override.yml monta path più
      # specifici sugli stessi sotto-percorsi e questi restano inutilizzati.
      - cli-credentials:/home/mercury/.config
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.17.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

# D-17: the mercury container's network should be limited to $OLLAMA_HOST +
# Jira API + Google Chat API + GitHub API. Not expressible with Docker/Compose:
# requires firewall/egress policy at the host level or a reverse proxy in the
# real deployment (office private cloud) — known gap, not implemented here.

volumes:
  wiki-vault:
    name: mercury_wiki-vault
  qdrant-data:
    name: mercury_qdrant-data
  cli-credentials:
    name: mercury_cli-credentials
